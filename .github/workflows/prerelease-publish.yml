name: Publish

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - uses: actions/checkout@v7.0.1
    - name: Set up JDK
      uses: actions/setup-java@v6.0.1
      with:
        distribution: temurin
        java-version: |
          8
          16
          17
          21

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6.3.0

    - name: Get version from gradle.properties
      run: |
        VERSION=$(grep "^version=" gradle.properties | cut -d'=' -f2)
        echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Get git hash
      run: echo "GIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

    - name: Publish to maven repository
      env:
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      run: ./gradlew publish -Pversion="${VERSION}-SNAPSHOT"

    - name: Build with Gradle
      run: ./gradlew clean build -Pversion="${VERSION}+${GIT_HASH}"

    - uses: actions/upload-artifact@v7.0.1
      with:
        name: pv-addon-discs
        archive: false
        path: |
          plugin/build/libs/*.jar
          !plugin/build/libs/*-dev.jar
          !plugin/build/libs/*-sources.jar
          !plugin/build/libs/*-javadoc.jar

    - uses: actions/upload-artifact@v7.0.1
      with:
        name: pv-addon-discs
        path: |
          plugin/build/libs/*.jar
          !plugin/build/libs/*-dev.jar
          !plugin/build/libs/*-sources.jar
          !plugin/build/libs/*-javadoc.jar
